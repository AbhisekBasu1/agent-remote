name: Bug report
description: Report a reproducible Agent Remote defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not attach real agent transcripts, private audio, credentials, or unredacted logs. Report vulnerabilities through SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS version, Apple silicon/Intel, USB/Bluetooth, controller revision
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic or redacted data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: driver
    attributes:
      label: Bluetooth microphone driver
      options:
        - Not installed
        - Installed
        - Not relevant
    validations:
      required: true
